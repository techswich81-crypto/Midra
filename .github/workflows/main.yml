name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project if it was uploaded as a .zip
        run: |
          Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$Z" ]; then
            echo "Zip mila: $Z"
            mkdir -p _src
            unzip -q -o "$Z" -d _src
          else
            echo "Zip nahi mila, repo ki files seedhe use hongi."
          fi

      - name: Find project folder
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts nahi mila."
            find . -maxdepth 4 -not -path './.git/*' | head -100
            exit 1
          fi
          D=$(dirname "$S")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"

      - name: Auto-fix known source errors
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          import re, pathlib
          base = pathlib.Path('app/src/main/java/com/gugugaga/mediaplatform')

          def edit(rel, fn):
              p = base / rel
              if not p.exists():
                  print('MISSING', rel); return
              s = p.read_text()
              n = fn(s)
              if n != s:
                  p.write_text(n); print('patched  ', rel)
              else:
                  print('unchanged', rel)

          # 1) "/*" inside a comment opens a nested comment in Kotlin -> Unclosed comment
          edit('adblock/AdBlockUpdateWorker.kt',
               lambda s: s.replace('RTDB `adblock/*` (killSwitch', 'RTDB node adblock (killSwitch'))

          # 2) BrowserScreen.kt had a duplicated block -> cut it out
          def fix_browser(s):
              dup  = '\n    manager.pendingGeo?.let { g -> g.callback.invoke(g.origin, res.values.any { it }, false) }'
              real = '\n    manager.pendingGeo?.let { g ->\n        AlertDialog('
              i, j = s.find(dup), s.find(real)
              if i != -1 and j != -1 and i < j:
                  return s[:i] + s[j:]
              return s
          edit('ui/browser/BrowserScreen.kt', fix_browser)

          # 3) avoid soft-keyword names (suspend / open) used as function names
          edit('browser/TabManager.kt',
               lambda s: s.replace('forEach { suspend(it) }', 'forEach { suspendTab(it) }')
                         .replace('private fun suspend(t: Tab)', 'private fun suspendTab(t: Tab)'))

          def fix_search(s):
              s = s.replace('val open: (String, String, String) -> Unit =', 'val openUrl: (String, String, String) -> Unit =')
              return re.sub(r'(?<![\w.])open\(', 'openUrl(', s)
          edit('ui/search/SearchScreen.kt', fix_search)

          # 4) 'dynamic' is a soft keyword; use a plain name for the ViewModel property
          edit('ui/settings/SettingsViewModel.kt', lambda s: s.replace('val dynamic: StateFlow<Boolean>', 'val dynColor: StateFlow<Boolean>'))
          edit('ui/settings/SettingsScreen.kt', lambda s: s.replace('vm.dynamic.collectAsStateWithLifecycle()', 'vm.dynColor.collectAsStateWithLifecycle()'))
          PY

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Secret GOOGLE_SERVICES_JSON_BASE64 missing"; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Decode fixed debug keystore (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          fi

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --console=plain 2>&1 | tee build.log

      - name: ERRORS (sirf ye hissa copy karke bhejo)
        if: failure()
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=========== ERRORS ==========="
          grep -E '^e: |error:|FAILURE|What went wrong' -A2 build.log | sed 's#.*/mediaplatform/app/src/main/java/com/gugugaga/mediaplatform/##' | head -80

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          

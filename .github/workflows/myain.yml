name: Build Debug APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Unzip project if it was uploaded as a .zip
        run: |
          Z=$(find . -maxdepth 2 -iname '*.zip' -not -path './.git/*' | head -n 1)
          if [ -n "$Z" ]; then
            echo "Zip mila: $Z"
            mkdir -p _src
            unzip -q -o "$Z" -d _src
          else
            echo "Zip nahi mila, repo ki files seedhe use hongi."
          fi

      - name: Find project folder
        run: |
          S=$(find . -name settings.gradle.kts -not -path './.git/*' | head -n 1)
          if [ -z "$S" ]; then
            echo "settings.gradle.kts nahi mila. Repo me ye files hain:"
            find . -maxdepth 4 -not -path './.git/*' | head -100
            exit 1
          fi
          D=$(dirname "$S")
          echo "Project folder: $D"
          echo "PROJECT_DIR=$D" >> "$GITHUB_ENV"
          ls -la "$D"

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || { echo "Secret GOOGLE_SERVICES_JSON_BASE64 missing"; exit 1; }
          test -d app || { echo "app folder nahi mila. Yahan ye hai:"; ls -la; exit 1; }
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/google-services.json

      - name: Decode fixed debug keystore (optional)
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > app/debug.keystore
          else
            echo "No fixed keystore secret; default debug key use hogi."
          fi

      - name: Build
        working-directory: ${{ env.PROJECT_DIR }}
        env:
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}
          DEBUG_KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
          DEBUG_KEY_ALIAS: ${{ secrets.DEBUG_KEY_ALIAS }}
          DEBUG_KEY_PASSWORD: ${{ secrets.DEBUG_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
